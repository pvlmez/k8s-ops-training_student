---
# Re-fetch the admin kubeconfig to the workstation (e.g. after a restore).
#   ansible-playbook playbooks/kubeconfig.yml
- name: Check the inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Check the inventory
      ansible.builtin.import_tasks: tasks/require-inventory.yml

- name: Copy kubeconfig to the workstation
  hosts: "{{ groups['rke2_servers'][0] }}"
  gather_facts: false
  roles:
    - kubeconfig
