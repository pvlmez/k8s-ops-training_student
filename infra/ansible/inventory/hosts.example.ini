# Copy to hosts.ini and edit. One inventory per attendee cluster.
#   ansible_host = IP the workstation uses to reach the node
#   node_ip      = IP the nodes use to talk to each other (often the same)

[rke2_servers]
node1 ansible_host=192.168.10.11 node_ip=192.168.10.11

[rke2_agents]
node2 ansible_host=192.168.10.12 node_ip=192.168.10.12
node3 ansible_host=192.168.10.13 node_ip=192.168.10.13

# Lab 12: move node4 into [rke2_agents] and run playbooks/add-node.yml
[spare]
# node4 ansible_host=192.168.10.14 node_ip=192.168.10.14

[cluster:children]
rke2_servers
rke2_agents

[cluster:vars]
ansible_user=ubuntu
ansible_become=true
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
