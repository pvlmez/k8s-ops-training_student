---
- name: Check whether RKE2 server is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/rke2
  register: rke2_bin

- name: Create RKE2 config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/rancher/rke2
    - /var/lib/rancher/rke2/server/manifests

- name: Write RKE2 server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  notify: Restart rke2-server

- name: Write Cilium HelmChartConfig
  ansible.builtin.template:
    src: rke2-cilium-config.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
    mode: "0644"

- name: Download RKE2 install script
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /usr/local/sbin/install-rke2.sh
    mode: "0755"

- name: Install RKE2 server
  ansible.builtin.command: /usr/local/sbin/install-rke2.sh
  environment:
    INSTALL_RKE2_TYPE: server
    INSTALL_RKE2_CHANNEL: "{{ rke2_channel }}"
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
  when: not rke2_bin.stat.exists

- name: Enable and start rke2-server (first start takes 2-5 minutes)
  ansible.builtin.systemd:
    name: rke2-server
    enabled: true
    state: started
  # Servers start one at a time so etcd membership changes are serialised
  throttle: 1

- name: Wait for the node token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/rke2/server/node-token
    timeout: 600

- name: Wait for this node to report Ready
  ansible.builtin.command: >
    /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
    get node {{ ansible_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 60
  delay: 10
  changed_when: false
