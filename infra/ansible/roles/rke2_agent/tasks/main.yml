---
- name: Check whether RKE2 agent is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/rke2
  register: rke2_bin

- name: Create RKE2 config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Write RKE2 agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  notify: Restart rke2-agent

- name: Download RKE2 install script
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /usr/local/sbin/install-rke2.sh
    mode: "0755"

- name: Install RKE2 agent
  ansible.builtin.command: /usr/local/sbin/install-rke2.sh
  environment:
    INSTALL_RKE2_TYPE: agent
    INSTALL_RKE2_CHANNEL: "{{ rke2_channel }}"
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
  when: not rke2_bin.stat.exists

- name: Enable and start rke2-agent
  ansible.builtin.systemd:
    name: rke2-agent
    enabled: true
    state: started

- name: Wait for this node to report Ready (checked from the first server)
  ansible.builtin.command: >
    /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
    get node {{ ansible_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  delegate_to: "{{ groups['rke2_servers'][0] }}"
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 60
  delay: 10
  changed_when: false
