# Kafka cluster "platform" in KRaft mode (no ZooKeeper).
# 3 nodes, each acting as both controller (metadata quorum) and broker.
# Production would usually separate controller and broker pools.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: platform
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        class: local-path
        size: 5Gi
        deleteClaim: true        # LAB ONLY
        kraftMetadata: shared
  resources:
    requests: { cpu: 100m, memory: 768Mi }
    limits: { memory: 1Gi }
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
  template:
    pod:
      # Spread brokers across nodes so losing a node loses only one broker
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    strimzi.io/cluster: platform
                    strimzi.io/kind: Kafka
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: platform
  namespace: kafka
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      auto.create.topics.enable: false
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator:
      resources:
        requests: { cpu: 20m, memory: 192Mi }
        limits: { memory: 384Mi }
    userOperator:
      resources:
        requests: { cpu: 20m, memory: 192Mi }
        limits: { memory: 384Mi }
  # Kafka Exporter: consumer-group lag and topic/partition metrics
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
---
# JMX -> Prometheus rules. Deliberately short: enough for the broker,
# request and replication panels used in the labs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: kafka
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels: { clientId: "$3", topic: "$4", partition: "$5" }
      - pattern: kafka.server<type=(.+), name=(.+)PerSec\w*, topic=(.+)><>Count
        name: kafka_server_$1_$2_total
        type: COUNTER
        labels: { topic: "$3" }
      - pattern: kafka.server<type=(.+), name=(.+)PerSec\w*><>Count
        name: kafka_server_$1_$2_total
        type: COUNTER
      - pattern: kafka.server<type=(.+), name=(.+)><>(Count|Value)
        name: kafka_server_$1_$2
      - pattern: kafka.controller<type=(.+), name=(.+)><>(Count|Value)
        name: kafka_controller_$1_$2
      - pattern: kafka.network<type=(.+), name=(.+), request=(.+)><>Count
        name: kafka_network_$1_$2_total
        type: COUNTER
        labels: { request: "$3" }
      - pattern: kafka.log<type=(.+), name=(.+), topic=(.+), partition=(.+)><>Value
        name: kafka_log_$1_$2
        type: GAUGE
        labels: { topic: "$3", partition: "$4" }
      - pattern: java.lang<type=(.+), name=(.+)><(.+)>(\w+)
        name: java_lang_$1_$4_$3_$2
      - pattern: java.lang<type=Memory><HeapMemoryUsage>(\w+)
        name: java_lang_memory_heapmemoryusage_$1
---
# Scrape the brokers and the Kafka Exporter
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka
  namespace: kafka
spec:
  selector:
    matchExpressions:
      - key: strimzi.io/kind
        operator: In
        values: [Kafka]
  podMetricsEndpoints:
    - path: /metrics
      port: tcp-prometheus
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_strimzi_io_name]
          targetLabel: strimzi_io_name
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
