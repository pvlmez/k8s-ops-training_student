# Topics are Kubernetes resources: the Topic Operator creates/updates them in Kafka.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: orders
  namespace: kafka
  labels:
    strimzi.io/cluster: platform
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 86400000       # 1 day
    min.insync.replicas: 2
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: audit-events
  namespace: kafka
  labels:
    strimzi.io/cluster: platform
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000      # 7 days
    cleanup.policy: delete
