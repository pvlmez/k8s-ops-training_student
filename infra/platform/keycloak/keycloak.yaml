# Keycloak instance managed by the Keycloak Operator.
# Rendered with envsubst: ${DOMAIN}, ${KEYCLOAK_VERSION}.
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 1
  # No "image:" here on purpose. The operator then runs the Keycloak image
  # matching its own version (${KEYCLOAK_VERSION}). Setting image: makes the
  # operator assume a pre-built ("optimized") custom image and start it with
  # --optimized, which fails with the stock image unless startOptimized: false.
  db:
    vendor: postgres
    host: postgres
    port: 5432
    database: keycloak
    usernameSecret: { name: keycloak-db, key: username }
    passwordSecret: { name: keycloak-db, key: password }
  http:
    httpEnabled: true          # LAB ONLY: plain HTTP behind Traefik
  hostname:
    hostname: http://keycloak.${DOMAIN}
    strict: false
  proxy:
    headers: xforwarded
  ingress:
    enabled: false             # we create our own Ingress to the HTTP port below
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { memory: 1Gi }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
spec:
  ingressClassName: traefik
  rules:
    - host: keycloak.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service   # created by the operator
                port:
                  number: 8080
