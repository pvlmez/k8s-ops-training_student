# Minimal PostgreSQL for Keycloak: one StatefulSet replica with a PVC.
# LAB ONLY: production would use an HA database (CloudNativePG, managed DB).
# The keycloak-db Secret is created by deploy.sh.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: keycloak
  labels: { app.kubernetes.io/name: postgres }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: keycloak
  labels: { app.kubernetes.io/name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      securityContext:
        fsGroup: 70            # postgres user in the alpine image
      containers:
        - name: postgres
          image: ${POSTGRES_IMAGE}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: keycloak-db, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-db, key: password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d keycloak"] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
