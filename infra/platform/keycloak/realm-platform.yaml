# "platform" realm: users and an OIDC client for Grafana SSO (lab 9).
# ${DOMAIN} is filled by deploy.sh; ${GRAFANA_CLIENT_SECRET} is a Keycloak
# placeholder, filled by the operator from the grafana-oauth Secret.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: platform
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    GRAFANA_CLIENT_SECRET:
      secret:
        name: grafana-oauth
        key: client-secret
  realm:
    realm: platform
    enabled: true
    displayName: Platform (training)
    sslRequired: none          # LAB ONLY: the lab has no TLS (planned for v2). Production: "external" or "all"
    roles:
      realm:
        - name: grafana-admin
          description: Grafana Admin role
        - name: grafana-editor
          description: Grafana Editor role
    clients:
      - clientId: grafana
        name: Grafana
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: "${GRAFANA_CLIENT_SECRET}"
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        rootUrl: http://grafana.${DOMAIN}
        redirectUris: ["http://grafana.${DOMAIN}/login/generic_oauth"]
        webOrigins: ["http://grafana.${DOMAIN}"]
        protocolMappers:
          - name: realm-roles
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            config:
              multivalued: "true"
              claim.name: roles
              jsonType.label: String
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
    users:
      - username: ops-admin
        enabled: true
        email: ops-admin@example.test
        emailVerified: true
        firstName: Ops
        lastName: Admin
        credentials:
          - { type: password, value: "ChangeMe-Admin1", temporary: false }
        realmRoles: [grafana-admin]
      - username: ops-user
        enabled: true
        email: ops-user@example.test
        emailVerified: true
        firstName: Ops
        lastName: User
        credentials:
          - { type: password, value: "ChangeMe-User1", temporary: false }
        realmRoles: []
