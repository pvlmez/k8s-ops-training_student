# Extra values for kube-prometheus-stack: Grafana login through Keycloak.
# Applied in lab 9 with:
#   helm upgrade kube-prometheus-stack ... -f kube-prometheus-stack.yaml -f grafana-keycloak-sso.yaml
# Rendered with envsubst: ${DOMAIN}.
grafana:
  envValueFrom:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
      secretKeyRef:
        name: grafana-oauth
        key: client-secret
  grafana.ini:
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      scopes: openid email profile
      auth_url: http://keycloak.${DOMAIN}/realms/platform/protocol/openid-connect/auth
      token_url: http://keycloak.${DOMAIN}/realms/platform/protocol/openid-connect/token
      api_url: http://keycloak.${DOMAIN}/realms/platform/protocol/openid-connect/userinfo
      signout_redirect_url: http://keycloak.${DOMAIN}/realms/platform/protocol/openid-connect/logout?post_logout_redirect_uri=http%3A%2F%2Fgrafana.${DOMAIN}%2Flogin
      # Map the Keycloak realm roles (claim "roles") to Grafana roles
      role_attribute_path: "contains(roles[*], 'grafana-admin') && 'Admin' || contains(roles[*], 'grafana-editor') && 'Editor' || 'Viewer'"
      login_attribute_path: preferred_username
      email_attribute_path: email
      name_attribute_path: name
