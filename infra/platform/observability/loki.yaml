# Loki in single-binary mode with filesystem storage (grafana-community/loki).
# LAB ONLY: production uses object storage (S3-compatible) and the
# simple-scalable or distributed mode.
# Chart keys change between major versions: re-check after bumping CHART_LOKI.
deploymentMode: SingleBinary

loki:
  auth_enabled: false          # single tenant
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 48h
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

# Components not used in single-binary mode
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
# No "minio:" key: the MinIO subchart was removed from the community chart
# on 2026-10-31 and its values schema now rejects the key.
