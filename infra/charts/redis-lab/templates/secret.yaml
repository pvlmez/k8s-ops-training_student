{{- if and (include "redis-lab.useSecret" .) (not .Values.auth.existingSecret) }}
{{- /* Keep the generated password stable across upgrades */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "redis-lab.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis-lab.fullname" . }}
  labels:
    {{- include "redis-lab.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.auth.password }}
  redis-password: {{ .Values.auth.password | b64enc | quote }}
  {{- else if $existing }}
  redis-password: {{ index $existing.data "redis-password" | quote }}
  {{- else }}
  redis-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
