apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis-lab.fullname" . }}
  labels:
    {{- include "redis-lab.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "redis-lab.fullname" . }}-headless
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "redis-lab.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "redis-lab.selectorLabels" . | nindent 8 }}
      annotations:
        # Restart pods when the config changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-redis-password: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-redis-password: |
          {{ printf "{{- with secret %q -}}{{ .Data.data.%s }}{{- end -}}" .Values.vault.secretPath .Values.vault.secretKey }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        fsGroup: 999           # redis user in the official image
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/scripts/start.sh"]
          # We bypass the image entrypoint (which drops root), so set the user here
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - name: redis
              containerPort: 6379
          {{- if include "redis-lab.useSecret" . }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redis-lab.secretName" . }}
                  key: redis-password
          {{- end }}
          readinessProbe:
            exec: { command: ["sh", "/scripts/ping.sh"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "/scripts/ping.sh"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/redis/redis.conf, subPath: redis.conf }
            - { name: config, mountPath: /scripts }
        {{- if .Values.metrics.enabled }}
        - name: exporter
          image: {{ .Values.metrics.image }}
          # The image keeps the binary at /redis_exporter, which is not on PATH
          command: ["sh", "-c", ". /scripts/password.sh; REDIS_PASSWORD=\"$REDISCLI_AUTH\" exec /redis_exporter"]
          {{- if include "redis-lab.useSecret" . }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "redis-lab.secretName" . }}
                  key: redis-password
          {{- end }}
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 48Mi }
          volumeMounts:
            - { name: config, mountPath: /scripts }
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "redis-lab.fullname" . }}
            defaultMode: 0755
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
