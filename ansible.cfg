# Lets you run the playbooks from the repository root, e.g.
#   ansible-playbook infra/ansible/playbooks/site.yml
# Ansible reads ansible.cfg from the directory you run it in, so this mirrors
# infra/ansible/ansible.cfg (used when you run from infra/ansible). Relative
# paths here are relative to this file. Keep the two files in step.
[defaults]
inventory = infra/ansible/inventory/hosts.ini
roles_path = infra/ansible/roles
host_key_checking = False
retry_files_enabled = False
forks = 10
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
pipelining = True
