# Lab 14: a small, healthy "shop" in the namespace lab14. The faults break it.
#   web      nginx, 2 pods, behind the Service "web" and an Ingress
#   client   a pod that calls the shop from inside the cluster
# Created by:  labs/files/lab-14/fault.sh setup
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop-web
  template:
    metadata:
      labels:
        app: shop-web
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: shop-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: docker.io/library/nginx:1.27-alpine
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
