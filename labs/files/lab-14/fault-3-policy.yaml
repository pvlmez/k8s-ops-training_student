# Lab 14, fault 3: someone "hardened" the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hardening
  annotations:
    change-ticket: "CHG-2041 namespace hardening"
spec:
  podSelector:
    matchLabels:
      app: client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: shop-web
      ports:
        - protocol: TCP
          port: 80
