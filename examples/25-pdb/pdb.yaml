# Example 25: a PodDisruptionBudget: at least 2 of the 3 pods must stay up during voluntary disruptions.
#   kubectl apply -f examples/25-pdb/pdb.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: ex-pdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: ex-pdb
spec:
  replicas: 3
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: podinfo
  namespace: ex-pdb
spec:
  minAvailable: 2               # or maxUnavailable: 1
  selector:
    matchLabels:
      app: podinfo
