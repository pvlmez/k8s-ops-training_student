# Example 14: a LoadBalancer Service, in a cluster without a load balancer.  kubectl apply -f examples/14-service-loadbalancer/service.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: ex-loadbalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: ex-loadbalancer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: ex-loadbalancer
spec:
  type: LoadBalancer       # a NodePort, plus a request for an external load balancer
  selector:
    app: podinfo
  ports:
    - name: http
      port: 80               # the Service's port
      targetPort: http       # the container's port (9898), by name
      nodePort: 30899        # fixed here so the commands can name it; left out, Kubernetes picks one in 30000-32767
