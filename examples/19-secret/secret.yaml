# Example 19: a Secret, read as an environment variable and mounted as files.
#   kubectl apply -f examples/19-secret/secret.yaml
# ⚠️ A Secret written into a file in Git is readable by anyone who can read the repository.
#    Production keeps the values in a secret store (the platform uses Vault) and never in Git.
apiVersion: v1
kind: Namespace
metadata:
  name: ex-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: ex-secret
type: Opaque
stringData:                     # plain text here; the API server stores it base64-encoded under "data"
  username: shop
  password: lab-only-not-a-real-password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: ex-secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:           # one key of the Secret as one variable
                  name: db-credentials
                  key: username
            - name: PODINFO_CONFIG_PATH
              value: /configs
          volumeMounts:
            - name: credentials
              mountPath: /configs       # one file per key: /configs/username, /configs/password
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: credentials
          secret:
            secretName: db-credentials
