# Example 04: the three QoS classes.  kubectl apply -f examples/04-resources/qos.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: ex-resources
---
apiVersion: v1
kind: Pod
metadata:
  name: besteffort            # no requests, no limits: first to go when a node runs short
  namespace: ex-resources
spec:
  containers:
    - name: podinfo
      image: ghcr.io/stefanprodan/podinfo:6.15.0
---
apiVersion: v1
kind: Pod
metadata:
  name: burstable             # requests below the limits (or no limits): the usual case
  namespace: ex-resources
spec:
  containers:
    - name: podinfo
      image: ghcr.io/stefanprodan/podinfo:6.15.0
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: guaranteed            # requests equal to limits, for CPU and memory: last to go
  namespace: ex-resources
spec:
  containers:
    - name: podinfo
      image: ghcr.io/stefanprodan/podinfo:6.15.0
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 50m, memory: 64Mi}
