# Example 02, "Try this": an init container that fails, so the app never starts.
#   kubectl apply -f examples/02-multi-container/broken-init.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: ex-multi
---
apiVersion: v1
kind: Pod
metadata:
  name: broken
  namespace: ex-multi
spec:
  terminationGracePeriodSeconds: 2
  initContainers:
    - name: wait-for-database
      image: docker.io/library/busybox:1.37
      command: ["sh", "-c", "echo 'checking for the database...'; nslookup database.ex-multi.svc.cluster.local || { echo 'no database: giving up'; exit 1; }"]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {memory: 16Mi}
  containers:
    - name: podinfo
      image: ghcr.io/stefanprodan/podinfo:6.15.0
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 64Mi}
